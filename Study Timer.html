<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Timer</title>
<style>
:root{--bg:#f3f5fb;--surface:#fff;--ink:#16204a;--muted:#5d678f;--line:#d9def0;--accent:#2f4bd8;--accent-ink:#fff;--hi:#ffe45c;--break:#12805c;--danger:#c23b3b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1430;--surface:#182046;--ink:#eaedff;--muted:#a1abd6;--line:#2c3668;--accent:#8ea2ff;--accent-ink:#0f1430;--hi:#ffe45c;--break:#4fd1a1;--danger:#ff8a8a}}
:root[data-theme="dark"]{--bg:#0f1430;--surface:#182046;--ink:#eaedff;--muted:#a1abd6;--line:#2c3668;--accent:#8ea2ff;--accent-ink:#0f1430;--hi:#ffe45c;--break:#4fd1a1;--danger:#ff8a8a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.is-break{--accent:var(--break)}
body.is-break .ring-fg{stroke:var(--break)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;max-width:1080px;margin:0 auto}
h1{font:700 1.35rem Georgia,"Times New Roman",serif;margin:0}
h1 mark{background:var(--hi);color:#16204a;padding:0 6px;border-radius:4px}
h2{font:700 1rem Georgia,serif;margin:0 0 10px}
main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;padding:0 20px 28px;max-width:1080px;margin:0 auto}
@media(max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 14px}
button:hover{border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dial{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:18px auto}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{stroke:var(--line)}
.ring-fg{stroke:var(--accent);transition:stroke-dashoffset .3s linear}
.dial .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#time{font:700 3.6rem/1 Georgia,serif;font-variant-numeric:tabular-nums}
#label{color:var(--muted);margin-top:6px;max-width:80%;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ctrl .primary{min-width:130px;font-size:1.05rem;padding:10px 20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 140px;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
input[type=text],input[type=number],select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;color:var(--ink)}
.small{font-size:.85rem;color:var(--muted)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin-top:10px}
.stats b{display:block;font:700 1.35rem Georgia,serif}
.week{display:flex;gap:6px;align-items:flex-end;height:80px;margin-top:12px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.7rem;color:var(--muted)}
.week span{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
ul{list-style:none;margin:10px 0 0;padding:0}
li{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
li .nm{flex:1;min-width:0;overflow-wrap:anywhere}
li.done .nm{text-decoration:line-through;color:var(--muted)}
li.active .nm{background:linear-gradient(transparent 55%,var(--hi) 55%);color:#16204a}
li button{padding:3px 9px;font-size:.8rem}
.subj{display:flex;justify-content:space-between;font-size:.9rem;padding:3px 0}
details summary{cursor:pointer;font-weight:700}
details .row{margin-top:10px}
.chk{display:flex;align-items:center;gap:8px;flex:1 1 100%}
.chk input{width:auto}
body.focus-mode .side{display:none}
body.focus-mode main{grid-template-columns:1fr;max-width:560px}
.tip{border-left:4px solid var(--hi);padding:4px 10px;color:var(--muted);font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Study <mark>Timer</mark></h1>
  <div class="row" style="flex:0 0 auto">
    <button id="focusBtn" aria-pressed="false" title="Hide everything except the timer">Focus view</button>
    <button id="themeBtn" aria-label="Toggle dark mode">Theme</button>
  </div>
</header>
<main>
  <div class="col">
    <section class="card">
      <div class="tabs" id="tabs" role="group" aria-label="Timer mode">
        <button data-m="focus" aria-pressed="true">Focus</button>
        <button data-m="short" aria-pressed="false">Short break</button>
        <button data-m="long" aria-pressed="false">Long break</button>
      </div>
      <div class="dial">
        <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="ring-bg" cx="60" cy="60" r="54" fill="none" stroke-width="7"/><circle class="ring-fg" id="ring" cx="60" cy="60" r="54" fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="0"/></svg>
        <div class="t"><div id="time" role="timer" aria-live="off">25:00</div><div id="label">Ready to focus</div></div>
      </div>
      <div class="ctrl">
        <button class="primary" id="start">Start</button>
        <button id="reset">Reset</button>
        <button id="skip">Skip</button>
        <button id="distract" title="Tap when you catch yourself getting distracted">I got distracted</button>
      </div>
      <p class="small" style="text-align:center;margin:12px 0 0">Shortcuts: <b>Space</b> start/pause · <b>R</b> reset · <b>S</b> skip</p>
    </section>

    <section class="card">
      <h2>This session</h2>
      <div class="row">
        <label class="f">Subject
          <select id="subject"></select>
        </label>
        <label class="f">Add subject
          <span class="row" style="flex-wrap:nowrap;gap:6px"><input type="text" id="newSubj" placeholder="e.g. Chemistry" maxlength="30"><button id="addSubj">Add</button></span>
        </label>
      </div>
      <div class="row" style="margin-top:10px">
        <label class="f">Timer style
          <select id="preset">
            <option value="25,5,15">Pomodoro · 25 / 5 / 15</option>
            <option value="50,10,30">Deep work · 50 / 10 / 30</option>
            <option value="90,20,30">Marathon · 90 / 20 / 30</option>
            <option value="15,3,10">Quick start · 15 / 3 / 10</option>
            <option value="custom">Custom</option>
          </select>
        </label>
        <label class="f">Ambient sound
          <select id="sound"><option value="off">Off</option><option value="brown">Brown noise</option><option value="rain">Rain</option></select>
        </label>
      </div>
      <details style="margin-top:12px" id="custom">
        <summary>Custom lengths and options</summary>
        <div class="row">
          <label class="f">Focus (min)<input type="number" id="cFocus" min="1" max="180"></label>
          <label class="f">Short break<input type="number" id="cShort" min="1" max="60"></label>
          <label class="f">Long break<input type="number" id="cLong" min="1" max="90"></label>
          <label class="f">Long break every<input type="number" id="cEvery" min="2" max="10"></label>
          <label class="chk"><input type="checkbox" id="auto"> Start the next round automatically</label>
          <label class="chk"><input type="checkbox" id="notify"> Show a notification when a round ends</label>
        </div>
      </details>
    </section>
  </div>

  <div class="col side">
    <section class="card">
      <h2>Today’s goal</h2>
      <div class="row" style="flex-wrap:nowrap;align-items:flex-end">
        <label class="f" style="flex:0 0 130px">Goal (minutes)<input type="number" id="goal" min="10" max="900" step="5"></label>
        <div style="flex:1"><div class="bar"><i id="goalBar"></i></div><div class="small" id="goalTxt"></div></div>
      </div>
      <div class="stats">
        <div><b id="sMin">0</b><span class="small">minutes</span></div>
        <div><b id="sSess">0</b><span class="small">sessions</span></div>
        <div><b id="sStreak">0</b><span class="small">day streak</span></div>
        <div><b id="sDis">0</b><span class="small">distractions</span></div>
      </div>
      <div class="week" id="week" aria-label="Focus minutes over the last 7 days"></div>
      <div id="bySubj" style="margin-top:12px"></div>
    </section>

    <section class="card">
      <h2>Study tasks</h2>
      <div class="row" style="flex-wrap:nowrap;gap:6px"><input type="text" id="taskIn" placeholder="What will you study? e.g. Chapter 4 problems" maxlength="80"><button id="addTask" style="flex:0 0 auto">Add</button></div>
      <ul id="tasks"></ul>
      <p class="small" id="taskEmpty">No tasks yet. Add one, then press “Work on this” to show it on the timer.</p>
    </section>

    <section class="card tip" id="tip"></section>
  </div>
</main>

<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
var KEY="studytimer.v1";
var def={s:{focus:25,short:5,long:15,every:4,auto:false,notify:false,preset:"25,5,15",goal:120,sound:"off",subject:"General",theme:""},subjects:["General","Math","Science","Languages","History"],tasks:[],log:{}};
var S=def;
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);S={s:Object.assign({},def.s,p.s||{}),subjects:p.subjects&&p.subjects.length?p.subjects:def.subjects,tasks:p.tasks||[],log:p.log||{}}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function today(){return new Date().toLocaleDateString("en-CA")}
function day(k){if(!S.log[k])S.log[k]={min:0,sess:0,dis:0,subj:{}};return S.log[k]}
function esc(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML}

var mode="focus",running=false,endAt=0,left=S.s.focus*60,total=left,round=0,activeTask=null,startedFocus=0;
function len(m){return S.s[m]*60}
function fmt(sec){sec=Math.max(0,Math.ceil(sec));var m=Math.floor(sec/60),s=sec%60;return (m<10?"0":"")+m+":"+(s<10?"0":"")+s}

function setMode(m,keepRun){
  mode=m;total=len(m);left=total;running=false;
  document.body.classList.toggle("is-break",m!=="focus");
  document.querySelectorAll("#tabs button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.m===m))});
  render();
}
function render(){
  $("time").textContent=fmt(left);
  var frac=total?left/total:0;
  $("ring").style.strokeDashoffset=String(339.3*(1-frac));
  $("start").textContent=running?"Pause":(left<total?"Resume":"Start");
  var t=activeTask&&S.tasks.filter(function(x){return x.id===activeTask})[0];
  $("label").textContent=mode==="focus"?(t?t.name:(running?"Studying "+S.s.subject:"Ready to focus")):(mode==="short"?"Short break: stretch, drink water":"Long break: walk around, rest your eyes");
  document.title=(running?fmt(left)+" · ":"")+(mode==="focus"?"Focus":"Break")+" · Study Timer";
}
function tick(){
  if(!running)return;
  left=(endAt-Date.now())/1000;
  if(left<=0){left=0;complete();return}
  render();
}
setInterval(tick,250);

function start(){
  if(running){running=false;render();return}
  if(mode==="focus"&&left===total)startedFocus=Date.now();
  endAt=Date.now()+left*1000;running=true;audioInit();render();
}
function elapsedMin(){return Math.floor((total-left)/60)}
function logFocus(min){
  if(min<1)return;var d=day(today());d.min+=min;d.subj[S.s.subject]=(d.subj[S.s.subject]||0)+min;save();stats();
}
function complete(){
  running=false;beep();
  if(mode==="focus"){logFocus(S.s.focus);day(today()).sess++;round++;save();stats();
    if(activeTask){/* keep task selected */}
    notify("Focus round done","Nice work. Time for a break.");
    setMode(round%S.s.every===0?"long":"short");
  }else{notify("Break over","Ready for the next focus round?");setMode("focus")}
  if(S.s.auto){start()}
}
function reset(){if(mode==="focus")logFocus(elapsedMin());running=false;left=total;render()}
function skip(){
  if(mode==="focus"){logFocus(elapsedMin());setMode(round%S.s.every===S.s.every-1?"long":"short")}else setMode("focus");
}
$("start").onclick=start;$("reset").onclick=reset;$("skip").onclick=skip;
$("tabs").onclick=function(e){var b=e.target.closest("button");if(!b)return;if(mode==="focus")logFocus(elapsedMin());setMode(b.dataset.m)};
$("distract").onclick=function(){day(today()).dis++;save();stats();var b=$("distract");b.textContent="Noted. Back to it!";setTimeout(function(){b.textContent="I got distracted"},1500)};
document.addEventListener("keydown",function(e){
  var t=e.target.tagName;if(t==="INPUT"||t==="SELECT"||t==="TEXTAREA"||t==="BUTTON")return;
  if(e.code==="Space"){e.preventDefault();start()}else if(e.key==="r"||e.key==="R")reset();else if(e.key==="s"||e.key==="S")skip();
});

/* audio */
var ac=null,beepOk=true,noiseSrc=null,noiseGain=null;
function audioInit(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();applySound()}catch(e){}}
function beep(){try{audioInit();if(!ac)return;[0,.25,.5].forEach(function(t){var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=t===.5?880:660;g.gain.setValueAtTime(.0001,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.25,ac.currentTime+t+.03);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+t+.22);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.25)})}catch(e){}}
function applySound(){
  try{
    if(noiseSrc){noiseSrc.stop();noiseSrc=null}
    if(!ac||S.s.sound==="off")return;
    var n=ac.sampleRate*4,buf=ac.createBuffer(1,n,ac.sampleRate),d=buf.getChannelData(0),last=0;
    for(var i=0;i<n;i++){var w=Math.random()*2-1;if(S.s.sound==="brown"){last=(last+.02*w)/1.02;d[i]=last*3.5}else d[i]=w*.5}
    var src=ac.createBufferSource();src.buffer=buf;src.loop=true;
    var f=ac.createBiquadFilter();f.type="lowpass";f.frequency.value=S.s.sound==="rain"?3200:800;
    var g=ac.createGain();g.gain.value=.35;src.connect(f);f.connect(g);g.connect(ac.destination);src.start();noiseSrc=src;
  }catch(e){}
}
function notify(t,b){
  if(!S.s.notify)return;
  try{if("Notification" in window&&Notification.permission==="granted")new Notification(t,{body:b})}catch(e){}
}

/* settings */
function fillCustom(){$("cFocus").value=S.s.focus;$("cShort").value=S.s.short;$("cLong").value=S.s.long;$("cEvery").value=S.s.every;$("auto").checked=S.s.auto;$("notify").checked=S.s.notify}
function clampInt(v,a,b,d){v=parseInt(v,10);return isNaN(v)?d:Math.min(b,Math.max(a,v))}
$("preset").value=S.s.preset;fillCustom();$("sound").value=S.s.sound;
$("preset").onchange=function(){
  var v=this.value;S.s.preset=v;
  if(v==="custom"){$("custom").open=true}else{var p=v.split(",").map(Number);S.s.focus=p[0];S.s.short=p[1];S.s.long=p[2];fillCustom()}
  save();if(!running){setMode(mode)}
};
["cFocus","cShort","cLong","cEvery"].forEach(function(id){$(id).onchange=function(){
  S.s.focus=clampInt($("cFocus").value,1,180,25);S.s.short=clampInt($("cShort").value,1,60,5);S.s.long=clampInt($("cLong").value,1,90,15);S.s.every=clampInt($("cEvery").value,2,10,4);
  var key=[S.s.focus,S.s.short,S.s.long].join(",");var ok=Array.prototype.some.call($("preset").options,function(o){return o.value===key});
  S.s.preset=ok?key:"custom";$("preset").value=S.s.preset;fillCustom();save();if(!running)setMode(mode)}});
$("auto").onchange=function(){S.s.auto=this.checked;save()};
$("notify").onchange=function(){S.s.notify=this.checked;save();
  if(this.checked&&"Notification" in window&&Notification.permission==="default"){try{Notification.requestPermission()}catch(e){}}};
$("sound").onchange=function(){S.s.sound=this.value;save();audioInit();applySound()};
$("goal").value=S.s.goal;$("goal").onchange=function(){S.s.goal=clampInt(this.value,10,900,120);this.value=S.s.goal;save();stats()};

/* subjects */
function subjects(){
  $("subject").innerHTML=S.subjects.map(function(s){return "<option>"+esc(s)+"</option>"}).join("");
  if(S.subjects.indexOf(S.s.subject)<0)S.s.subject=S.subjects[0];$("subject").value=S.s.subject;
}
$("subject").onchange=function(){S.s.subject=this.value;save();render()};
$("addSubj").onclick=function(){var v=$("newSubj").value.trim();if(!v)return;if(S.subjects.indexOf(v)<0)S.subjects.push(v);S.s.subject=v;$("newSubj").value="";save();subjects();render()};
$("newSubj").onkeydown=function(e){if(e.key==="Enter")$("addSubj").click()};

/* tasks */
function tasks(){
  $("taskEmpty").style.display=S.tasks.length?"none":"block";
  $("tasks").innerHTML=S.tasks.map(function(t){
    return '<li class="'+(t.done?"done ":"")+(t.id===activeTask?"active":"")+'"><input type="checkbox" data-d="'+t.id+'" '+(t.done?"checked":"")+' aria-label="Mark done"><span class="nm">'+esc(t.name)+'</span>'+(t.done?"":'<button data-a="'+t.id+'">'+(t.id===activeTask?"Working":"Work on this")+'</button>')+'<button data-x="'+t.id+'" aria-label="Delete task">✕</button></li>'}).join("");
}
function addTask(){var v=$("taskIn").value.trim();if(!v)return;S.tasks.push({id:Date.now(),name:v,done:false});$("taskIn").value="";save();tasks()}
$("addTask").onclick=addTask;$("taskIn").onkeydown=function(e){if(e.key==="Enter")addTask()};
$("tasks").onclick=function(e){
  var t=e.target,id;
  if(t.dataset.a){activeTask=+t.dataset.a}
  else if(t.dataset.x){id=+t.dataset.x;S.tasks=S.tasks.filter(function(x){return x.id!==id});if(activeTask===id)activeTask=null}
  else if(t.dataset.d){id=+t.dataset.d;S.tasks.forEach(function(x){if(x.id===id){x.done=t.checked;if(x.done&&activeTask===id)activeTask=null}})}
  else return;
  save();tasks();render();
};

/* stats */
function stats(){
  var d=day(today()),g=S.s.goal,pct=Math.min(100,Math.round(d.min/g*100));
  $("sMin").textContent=d.min;$("sSess").textContent=d.sess;$("sDis").textContent=d.dis;
  $("goalBar").style.width=pct+"%";
  $("goalTxt").textContent=d.min>=g?"Goal reached. Great work!":(g-d.min)+" minutes to go ("+pct+"%)";
  var st=0,dt=new Date();if(!(S.log[today()]&&S.log[today()].min>0))dt.setDate(dt.getDate()-1);
  while(S.log[dt.toLocaleDateString("en-CA")]&&S.log[dt.toLocaleDateString("en-CA")].min>0){st++;dt.setDate(dt.getDate()-1)}
  $("sStreak").textContent=st;
  var days=[],mx=1,names=["Su","Mo","Tu","We","Th","Fr","Sa"];
  for(var i=6;i>=0;i--){var x=new Date();x.setDate(x.getDate()-i);var k=x.toLocaleDateString("en-CA"),m=S.log[k]?S.log[k].min:0;mx=Math.max(mx,m);days.push([names[x.getDay()],m])}
  $("week").innerHTML=days.map(function(a){return '<div title="'+a[1]+' min"><span style="height:'+Math.round(a[1]/mx*60)+'px"></span>'+a[0]+'</div>'}).join("");
  var keys=Object.keys(d.subj).sort(function(a,b){return d.subj[b]-d.subj[a]});
  $("bySubj").innerHTML=keys.length?"<h2>By subject today</h2>"+keys.map(function(k){return '<div class="subj"><span>'+esc(k)+'</span><b>'+d.subj[k]+' min</b></div>'}).join(""):'<p class="small">Finish a focus round to see your time by subject.</p>';
}

/* view + theme */
$("focusBtn").onclick=function(){var on=document.body.classList.toggle("focus-mode");this.setAttribute("aria-pressed",String(on));this.textContent=on?"Show panels":"Focus view"};
$("themeBtn").onclick=function(){
  var dark=document.documentElement.dataset.theme==="dark"||(!document.documentElement.dataset.theme&&matchMedia("(prefers-color-scheme: dark)").matches);
  S.s.theme=dark?"light":"dark";document.documentElement.dataset.theme=S.s.theme;save();
};
if(S.s.theme)document.documentElement.dataset.theme=S.s.theme;

var tips=["Put your phone in another room. Even a face-down phone pulls at your attention.","Write down one goal for this round before you press Start.","Use breaks to move, drink water, and look far away. Skip social media.","If a stray thought pops up, jot it on paper and return to your task.","Hard subjects first, when your energy is highest.","Test yourself instead of rereading. Recall beats review."];
$("tip").textContent="Tip: "+tips[Math.floor(Math.random()*tips.length)];

subjects();tasks();stats();setMode("focus");
window.addEventListener("beforeunload",function(e){if(running&&mode==="focus"){e.preventDefault();e.returnValue=""}});
})();
</script>
</body>
</html>
